[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro Netlify adapter handles SSR via Netlify Functions automatically.
# Env vars (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SELLER_EMAIL, FROM_EMAIL,
# RESEND_API_KEY) must be set in Netlify dashboard → Site settings →
# Environment variables. They are intentionally NOT committed here.
